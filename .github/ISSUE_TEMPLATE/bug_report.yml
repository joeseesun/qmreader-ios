name: Bug report
description: Report a reproducible QMReader iOS problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve QMReader iOS. Remove private feed data before posting.
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: 0.5.0 (10) or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and iOS version
      placeholder: iPhone 15 Pro, iOS 18.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Tap…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove tokens, private URLs, and personal reading data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private data and credentials.
          required: true
